<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PizzaDeg Lab – testversion</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding:16px;background:#f4f4f4;color:#222}
.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}
.row{display:flex;gap:8px;flex-wrap:wrap}button{min-height:44px;border:0;border-radius:10px;padding:9px 14px;background:#e7e7e7;font-weight:700}button.active{background:#222;color:#fff}
.control{margin:18px 0}.lab{display:flex;justify-content:space-between;font-weight:700;gap:12px}
input[type=range]{width:100%;accent-color:#222}.muted{color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#f2f2f2;border-radius:10px;padding:10px}.num{font-size:1.25rem;font-weight:800}
.ok{color:#28723a;font-weight:700}.warn{color:#a33;font-weight:700}
li{margin:9px 0}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<style>
.language-selector{position:absolute;top:14px;right:16px;z-index:100;display:flex;gap:3px;padding:4px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.10)}
.language-selector button{border:0;background:transparent;padding:6px 9px;border-radius:999px;cursor:pointer;font:inherit;font-size:.82rem}
.language-selector button.active{background:#222;color:#fff}
</style>
<div class="language-selector" id="languageSelector">
<button type="button" data-lang="sv" class="active">🇸🇪 Svenska</button>
<button type="button" data-lang="en">🇬🇧 English</button>
</div>
<script>
(function(){
const P=[
["Officiell version","Official version"],["Napolitansk","Neapolitan"],
["Antal pizzor","Number of pizzas"],["Vikt per boll","Dough ball weight"],
["Hydrering","Hydration"],["Kalljäsning","Cold fermentation"],
["Jäst","Yeast"],["Ingredienser","Ingredients"],["Instruktioner","Instructions"],
["Färsk jäst","Fresh yeast"],["Torr jäst","Dry yeast"],["Dagar","Days"],
["Salt","Salt"],["Socker","Sugar"],["Honung","Honey"],["Olivolja","Olive oil"],
["Mjöl","Flour"],["Vatten","Water"],["Dela degen och forma bollar.","Divide the dough and shape into balls."]
];
const originals=new WeakMap();
function setLang(lang){
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT), a=[];
 while(w.nextNode())a.push(w.currentNode);
 a.forEach(n=>{
   if(!originals.has(n)) originals.set(n,n.nodeValue);
   let s=originals.get(n);
   if(lang==="en") P.forEach(x=>s=s.split(x[0]).join(x[1]));
   n.nodeValue=s;
 });
 document.documentElement.lang=lang==="en"?"en":"sv";
 document.querySelectorAll("#languageSelector button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 try{localStorage.setItem("pizzadeglab-language",lang)}catch(e){}
}
document.querySelectorAll("#languageSelector button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
try{if(localStorage.getItem("pizzadeglab-language")==="en")setLang("en")}catch(e){}
})();
</script>

<div class="wrap">
<div class="card">
<h1>🍕 PizzaDeg Lab</h1>
<p class="muted">Officiell version</p>
<div class="row"><button id="neo" class="active" type="button">🇮🇹 Napolitansk</button><button id="ny" type="button">🇺🇸 NY-style</button></div>
</div>

<div class="card">
<h2>Deg</h2>
<div class="control"><div class="lab"><span>Antal pizzor</span><span id="pOut"></span></div><input id="pizzas" type="range" min="1" max="16" value="4"></div>
<div class="control"><div class="lab"><span>Degboll</span><span><span id="ballOut"></span> g</span></div><input id="ball" type="range" min="180" max="400" step="5" value="280"><div class="muted">≈ <span id="sizeOut"></span>″ pizza</div></div>
<div class="control"><div class="lab"><span>Hydrering</span><span><span id="hydOut"></span>%</span></div><input id="hyd" type="range" min="62" max="80" value="62"></div>
<div class="control"><div class="lab"><span>Kalljäsning</span><span><span id="daysOut"></span> dygn</span></div><input id="days" type="range" min="1" max="5" value="4"></div>
<div class="control"><div class="lab"><span>Jäst</span></div><div class="row"><button id="dry" class="active" type="button">Torrjäst</button><button id="fresh" type="button">Färsk jäst</button></div></div>
</div>

<div class="card">
<h2>Mjölblandning</h2>
<p class="muted">Preset laddas automatiskt vid stilbyte. Du kan sedan experimentera.</p>
<div class="control"><div class="lab"><span>Caputo Pizzeria</span><span><span id="capOut"></span>%</span></div><input id="cap" type="range" min="0" max="100" value="80"></div>
<div class="control"><div class="lab"><span>Ramlösa Rustique</span><span><span id="rustOut"></span>%</span></div><input id="rust" type="range" min="0" max="100" value="20"></div>
<div class="control"><div class="lab"><span>Ramlösa Manitoba Cream</span><span><span id="manOut"></span>%</span></div><input id="man" type="range" min="0" max="100" value="0"></div>
<div id="blendStatus"></div>
</div>

<div class="card"><h2>Recept</h2><div id="recipe" class="grid"></div></div>
<div class="card"><h2>Så gör du</h2><ol id="instructions"></ol></div>
</div>

<script>
(function(){
"use strict";
let style="neo", yeast="dry";
const $=id=>document.getElementById(id);
const preset={neo:{cap:80,rust:20,man:0},ny:{cap:25,rust:15,man:60}};

function yeastPct(){
  if(style==="ny") return yeast==="dry" ? 0.4 : 1.2;
  const fresh=[0.18,0.12,0.08,0.055,0.04][Number($("days").value)-1];
  return yeast==="fresh" ? fresh : fresh/3;
}

function calc(){
  const pizzas=Number($("pizzas").value);
  const ball=Number($("ball").value);
  const hyd=Number($("hyd").value);
  const saltPct=style==="neo"?2:2.5;
  const sugarPct=style==="neo"?1:2;
  const oilPct=style==="neo"?1.5:3.3;
  const yeastPctValue=yeastPct();

  const total=pizzas*ball;
  const flour=total/(1+hyd/100+saltPct/100+sugarPct/100+oilPct/100+yeastPctValue/100);
  const water=flour*hyd/100;
  const salt=flour*saltPct/100;
  const sugar=flour*sugarPct/100;
  const oil=flour*oilPct/100;
  const yeastg=flour*yeastPctValue/100;

  const capPct=Number($("cap").value);
  const rustPct=Number($("rust").value);
  const manPct=Number($("man").value);
  const sum=capPct+rustPct+manPct;

  $("pOut").textContent=pizzas;
  $("ballOut").textContent=ball;
  $("sizeOut").textContent=((10 + (ball - 180) * 0.02).toFixed(1));
  $("hydOut").textContent=hyd;
  $("daysOut").textContent=$("days").value;
  $("capOut").textContent=capPct;
  $("rustOut").textContent=rustPct;
  $("manOut").textContent=manPct;

  $("blendStatus").innerHTML=sum===100
    ? '<span class="ok">✓ Mjölet är 100 %</span>'
    : '<span class="warn">⚠ Mjölet är '+sum+' % – justera till 100 %.</span>';

  const values=[
    ["Total deg",Math.round(total)+" g"],
    ["Mjöl totalt",Math.round(flour)+" g"],
    ["Vatten",Math.round(water)+" g"],
    ["Salt",Math.round(salt*10)/10+" g"],
    [style==="neo"?"Socker/honung":"Socker",Math.round(sugar*10)/10+" g"],
    ["Olivolja",Math.round(oil*10)/10+" g"],
    [yeast==="dry"?"Torrjäst":"Färsk jäst",Math.round(yeastg*10)/10+" g"],
    ["Caputo Pizzeria",Math.round(flour*capPct/100)+" g"],
    ["Ramlösa Rustique",Math.round(flour*rustPct/100)+" g"],
    ["Ramlösa Manitoba Cream",Math.round(flour*manPct/100)+" g"]
  ];
  $("recipe").innerHTML=values.map(v=>'<div class="item">'+v[0]+'<div class="num">'+v[1]+'</div></div>').join("");

  $("instructions").innerHTML=style==="neo"
  ? '<li>Använd kallt vatten och börja med ungefär 80 % av total mängd vatten.</li><li>Tillsätt jäst och socker/honung.</li><li>Tillsätt mjölet och börja blanda/knåda.</li><li>När degen börjat utveckla gluten, tillsätt saltet.</li><li>Arbeta långsamt in resterande cirka 20 % kalla vatten (bassinage).</li><li>Arbeta in olivoljan mot slutet.</li><li>Håll degen relativt sval under knådningen.</li><li>Bulkjäs tills degen ökat ungefär 50–100 % i volym.</li><li>Dela och runda till '+ball+' g-bollar.</li><li>Kalljäs i vald tid. 4–5 dygn är vår rekommenderade utgångspunkt.</li>'
  : '<li>Blanda kallt vatten, jäst och socker.</li><li>Tillsätt olivoljan och därefter mjölet.</li><li>Tillsätt saltet när degen börjat utveckla gluten.</li><li>Knåda tills degen är jämn och smidig.</li><li>Bulkjäs tills degen ökat ungefär 50–100 % i volym.</li><li>Dela och runda till '+ball+' g-bollar.</li><li>Kalljäs i vald tid. 4–5 dygn är vår rekommenderade utgångspunkt.</li><li>Baka på riktigt het pizzasten eller pizzastål i hemmaugn.</li>';
}

function setStyle(s){
  style=s;
  $("neo").classList.toggle("active",s==="neo");
  $("ny").classList.toggle("active",s==="ny");
  $("cap").value=preset[s].cap;
  $("rust").value=preset[s].rust;
  $("man").value=preset[s].man;
  $("hyd").value=62;
  $("hyd").disabled=s==="ny";
  calc();
}

["pizzas","ball","hyd","days","cap","rust","man"].forEach(id=>$(id).addEventListener("input",calc));
$("neo").addEventListener("click",()=>setStyle("neo"));
$("ny").addEventListener("click",()=>setStyle("ny"));
$("dry").addEventListener("click",()=>{yeast="dry";$("dry").classList.add("active");$("fresh").classList.remove("active");calc()});
$("fresh").addEventListener("click",()=>{yeast="fresh";$("fresh").classList.add("active");$("dry").classList.remove("active");calc()});
setStyle("neo");
})();
</script>
</body>
</html>
